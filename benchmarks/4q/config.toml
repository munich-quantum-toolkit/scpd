# The 4-qubit benchmark chip of the paper, as MQT SCPD plans it. The chip
# input is the routing_config.json of planar-superconducting-pd; pass it with
# --chip, as README.md in this directory shows. Every design rule is written
# out; every other key is present only when it differs from the default.

[chip]
input = "routing_config.json"

[ports.patterns]
launcher = '^Chip\.port\d+$'
resonator = '^Q\d+\.port0$'
conventional = '^(Q\d+\.port1|C\d+\.port0)$'
bridge_pair = '^C\d+\.port[12]$'
component = '^([^.]+)\.port\d+$'

[[ports.bridge_pairs]]
first = '^(C\d+)\.port1$'
second = '^(C\d+)\.port2$'

[ports.sequences]
all_outer = [
  "Q1.port0", "Q1.port1", "C12.port0", "Q2.port1", "Q2.port0", "C23.port0", "Q3.port0", "Q3.port1",
  "C34.port0", "Q4.port0", "Q4.port1", "C14.port0",
]
fixed_outer = [
  "Q1.port0", "Q1.port1", "C12.port0", "Q2.port1", "Q2.port0", "C23.port0", "Q3.port0", "Q3.port1",
  "C34.port0", "Q4.port0", "Q4.port1", "C14.port0",
]

[design_rules]
min_wire_spacing = 185.0
min_obstacle_spacing = 25.0
min_bend_radius = 50.0
min_straight_length = 100.0
target_resonator_length = 2500.0
resonator_length_tolerance = 100.0
max_feedline_utilization = 4
feedline_terminations = 0

[grid]
capacity_cells_x = 12
# The launcher slot sits on the launcher port, so the blocked border of the
# capacity grid must not cover it. A port inside the border is a freed cell in a
# wall that no capacity chain reaches, and the partitioning around it collapses.
launcher_offset_x = 7
launcher_offset_y = 7

[stages.assignment]
# How many launchers the assignment activates. A figure per chip with no
# default, taken from the prototype's driver of the same benchmark.
launcher_target = 2
