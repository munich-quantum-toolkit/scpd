# The 21-qubit benchmark chip. The chip input is the prototype's own
# routing_config.json, unchanged; README.md in this directory names its
# source. Every design rule is written out; every other key is present only
# when it differs from the default.

[chip]
input = "routing_config.json"

[ports.patterns]
launcher = '^Chip\.port\d+$'
resonator = '^Qb\d+\.port0$'
conventional = '^(Qb\d+\.port1|Coupler\d+_\d+\.port[0-4])$'

[ports.sequences]
all_outer = [
