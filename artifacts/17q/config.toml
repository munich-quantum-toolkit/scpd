# The 17-qubit benchmark chip. The chip input is the prototype's own
# routing_config.json, unchanged; README.md in this directory names its
# source. Every design rule is written out; every other key is present only
# when it differs from the default.

[chip]
input = "routing_config.json"

[ports.patterns]
launcher = '^Chip\.port\d+$'
resonator = '^Qb\d+\.port0$'
conventional = '^(Qb\d+\.port1|Coupler\d+_\d+\.port0)$'
bridge_pair = '^Coupler\d+_\d+\.port[1-4]$'
component = '^([^.]+)\.port\d+$'

[[ports.bridge_pairs]]
first = '^(Coupler\d+_\d+)\.port1$'
second = '^(Coupler\d+_\d+)\.port2$'

[[ports.bridge_pairs]]
first = '^(Coupler\d+_\d+)\.port3$'
second = '^(Coupler\d+_\d+)\.port4$'

[ports.sequences]
all_outer = [
  "Qb15.port1", "Qb15.port0", "Coupler14_15.port3", "Coupler14_15.port0", "Coupler14_15.port1",
  "Qb14.port1", "Qb14.port0", "Coupler13_14.port3", "Coupler13_14.port0", "Coupler13_14.port1",
  "Qb13.port1", "Coupler13_17.port3", "Coupler13_17.port0", "Coupler13_17.port1", "Qb17.port0",
  "Qb17.port1", "Coupler16_17.port1", "Coupler16_17.port0", "Coupler16_17.port3", "Qb16.port0",
  "Qb16.port1", "Coupler12_16.port3", "Coupler12_16.port0", "Coupler12_16.port1", "Qb12.port0",
  "Qb12.port1", "Coupler8_12.port1", "Coupler8_12.port0", "Coupler8_12.port3", "Qb8.port0",
  "Coupler7_8.port3", "Coupler7_8.port0", "Coupler7_8.port1", "Qb7.port0", "Qb7.port1",
  "Coupler3_7.port3", "Coupler3_7.port0", "Coupler3_7.port1", "Qb3.port1", "Qb3.port0",
  "Coupler3_4.port3", "Coupler3_4.port0", "Coupler3_4.port1", "Qb4.port1", "Qb4.port0",
  "Coupler4_5.port3", "Coupler4_5.port0", "Coupler4_5.port1", "Qb5.port1", "Coupler1_5.port3",
  "Coupler1_5.port0", "Coupler1_5.port1", "Qb1.port0", "Qb1.port1", "Coupler1_2.port1",
  "Coupler1_2.port0", "Coupler1_2.port3", "Qb2.port1", "Qb2.port0", "Coupler2_6.port1",
  "Coupler2_6.port0", "Coupler2_6.port3", "Qb6.port0", "Qb6.port1", "Coupler6_10.port1",
  "Coupler6_10.port0", "Coupler6_10.port3", "Qb10.port0", "Coupler10_11.port3",
  "Coupler10_11.port0", "Coupler10_11.port1", "Qb11.port0", "Qb11.port1", "Coupler11_15.port3",
  "Coupler11_15.port0", "Coupler11_15.port1",
]
fixed_outer = [
  "Qb15.port0", "Coupler14_15.port0", "Qb14.port1", "Qb14.port0", "Coupler13_14.port0",
  "Qb13.port1", "Coupler13_17.port0", "Qb17.port0", "Qb17.port1", "Coupler16_17.port0",
  "Qb16.port0", "Qb16.port1", "Coupler12_16.port0", "Qb12.port0", "Qb12.port1",
  "Coupler8_12.port0", "Qb8.port0", "Coupler7_8.port0", "Qb7.port0", "Qb7.port1",
  "Coupler3_7.port0", "Qb3.port1", "Qb3.port0", "Coupler3_4.port0", "Qb4.port1", "Qb4.port0",
  "Coupler4_5.port0", "Qb5.port1", "Coupler1_5.port0", "Qb1.port0", "Qb1.port1",
  "Coupler1_2.port0", "Qb2.port1", "Qb2.port0", "Coupler2_6.port0", "Qb6.port0", "Qb6.port1",
  "Coupler6_10.port0", "Qb10.port0", "Coupler10_11.port0", "Qb11.port0", "Qb11.port1",
  "Coupler11_15.port0", "Qb15.port1",
]

[design_rules]
min_wire_spacing = 185.0
min_obstacle_spacing = 25.0
min_bend_radius = 50.0
min_straight_length = 100.0
target_resonator_length = 2500.0
resonator_length_tolerance = 100.0
max_feedline_utilization = 5
feedline_terminations = 1

[grid]
capacity_cells_x = 25
capacity_cells_y = 25
launcher_offset_x = 20
launcher_offset_y = 20

[stages.assignment]
# How many launchers this chip's assignment activates. A per-chip figure with no
# default, taken from the driver of the same benchmark.
launcher_target = 7
