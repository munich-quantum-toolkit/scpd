[build-system]
build-backend = "scikit_build_core.build"
requires = [
  "nanobind~=3.1.0",
  "scikit-build-core>=1.1",
  "vcs-versioning>=2.3",
]


[project]
name = "mqt-scpd"
description = "Physical Design for Superconducting Quantum Chips"
readme = "README.md"
keywords = [ "design-automation", "MQT", "quantum-computing" ]
# HiGHS links Zlib-licensed pdqsort.
license = "MIT AND Apache-2.0 AND BSL-1.0 AND Zlib"
license-files = [ "LICENSE" ]
requires-python = ">=3.11.5"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Typing :: Typed",
]
dynamic = [ "import-names", "import-namespaces", "version" ]
dependencies = [
  # Match FLATBUFFERS_VERSION in cmake/ExternalDependencies.cmake.
  "flatbuffers~=25.12.19",
  "nanobind-backend>=1",
  # Rich 14.1 first supports TTY_INTERACTIVE.
  "rich>=14.1",
]

[[project.authors]]
name = "Michael Feldmeier"
email = "michael.feldmeier@tum.de"

[project.optional-dependencies]
gurobi = [ "gurobipy==14" ]
# KLayout 0.30.14 adds Python 3.15 wheels on Windows.
klayout = [
  "klayout>=0.30.14; python_version>='3.15'",
  "klayout~=0.30.13",
]

[project.urls]
Homepage = "https://github.com/munich-quantum-toolkit/scpd"
Documentation = "https://mqt.readthedocs.io/projects/scpd"
Issues = "https://github.com/munich-quantum-toolkit/scpd/issues"
Discussions = "https://github.com/munich-quantum-toolkit/scpd/discussions"

[project.scripts]
mqt-scpd = "mqt.scpd.cli:main"


[dependency-groups]
dev = [
  { include-group = "build" },
  { include-group = "test" },
  "nox>=2025.11.12",
]
test = [
  # Gurobi has no Windows ARM64 wheel.
  "gurobipy==14; sys_platform!='win32' or platform_machine!='ARM64'",
  # KLayout has no Windows ARM64 wheel.
  "klayout>=0.30.14; python_version>='3.15' and (sys_platform!='win32' or platform_machine!='ARM64')",
  "klayout~=0.30.13; sys_platform!='win32' or platform_machine!='ARM64'",
  # Exercise the NumPy path in the FlatBuffers bindings.
  "numpy>=2.3.2",
  "numpy>=2.5.2; python_version>='3.15'",
  "pytest>=9.0.1",
  "pytest-cov>=7.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8",
]
docs = [
  "breathe>=4.36",
  "furo>=2025.12.19",
  "ipywidgets>=8.1.7",
  "myst-nb>=1.4",
  "sphinx>=9",
  "sphinx-autoapi>=3.6",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7",
  "sphinx-llm>=1",
  "sphinxcontrib-bibtex>=2.7",
  "sphinxext-opengraph>=0.13",
]
build = [
  "cmake>=4.4.1",
  "nanobind~=3.1.0",
  "scikit-build-core>=1.1",
  "vcs-versioning>=2.3",
]


[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}/{build_type}"

[tool.scikit-build.build]
targets = [
  "mqt-scpd-bindings",
]

[tool.scikit-build.cmake]
# CMake 4.4 sets Py_GIL_DISABLED for free-threaded CPython on Windows.
version = ">=4.4.1"

[tool.scikit-build.cmake.define]
BUILD_MQT_SCPD_TESTS = "OFF"
BUILD_MQT_SCPD_BINDINGS = "ON"

[tool.scikit-build.ninja]
version = ">=1.10"

[tool.scikit-build.sdist]
include = [ "python/mqt/scpd/_version.py" ]
exclude = [
  "**/.github",
  "**/doc",
  "**/docs",
  "**/eval",
  "**/meta",
  "**/plots",
  "**/test",
  "**/tests",
]

[tool.scikit-build.wheel]
install-dir = "mqt/scpd"
packages = [ "python/mqt" ]
# Stable ABI for GIL-enabled CPython 3.11+.
py-api = "cp311"

[tool.scikit-build.install]
components = [ "mqt-scpd_Python" ]

[[tool.scikit-build.overrides]]
if.python-version = ">=3.15"
if.abi-flags = "t"
wheel.py-api = "cp315t"


[tool.uv]
required-version = ">=0.13.4"
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
  { file = "bindings/**/*.cpp" },
  { file = "python/mqt/scpd/flatbuffers/**/*.py" },
]

[tool.uv.sources]
mqt-scpd = { workspace = true }


[tool.cibuildwheel]
build = "cp3*"
skip = [ "*-musllinux_*", "cp314t-*" ]
archs = "auto64"
build-frontend = "uv"
test-command = "pytest {project}/test/python"
test-groups = [ "test" ]

[tool.cibuildwheel.linux]
environment = { DEPLOY = "ON" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel} --namespace-pkg mqt --ignore-existing"


[tool.ruff]
line-length = 120
namespace-packages = [ "mqt" ]
src = [ "python" ]
# Regenerate these modules with `nox -s schemas`.
extend-exclude = [ "python/mqt/scpd/flatbuffers" ]
force-exclude = true
preview = true
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"test/python/**" = [ "INP001", "T20" ]
"python/mqt/scpd/cli.py" = [ "T20" ]
"docs/**" = [ "INP001", "T20" ]
"noxfile.py" = [ "T20", "TID251" ]
"*.pyi" = [ "D301", "D418", "E501", "PYI021" ]
"*.ipynb" = [
  "D",
  "E402",
  "I002",
]

[tool.ruff.lint.isort]
known-first-party = [ "mqt.scpd" ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "C90",
  "COM812",  # Conflicts with the formatter.
  "PLR09",
  "PLR2004",
  "S101",
  "S404",
  "TID252"
]
future-annotations = true


[tool.repo-review.ignore]
GH200 = "We use Renovate instead of Dependabot"
PC160 = "We use a mirror of crate-ci/typos"
PC170 = "We do not use rST files anymore"


[tool.check-sdist]
sdist-only = [ "python/mqt/scpd/_version.py" ]
git-only = [
  "docs/*",
  "eval/*",
  "extern/*",
  "test/*",
  ".idea/*",
]


[tool.check-wheel-contents]
ignore = [ "W002" ]  # Package initializers can have identical contents.


[tool.pyproject-fmt]
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos]

[tool.typos.default]
extend-ignore-re = [
  '"id": ".*",',
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on"
]

[tool.typos.default.extend-identifiers]
countr_zero = "countr_zero"

[tool.typos.default.extend-words]
wille = "wille"
anc = "anc"
optin = "optin"
aer = "aer"
iy = "iy"
iz = "iz"
ket = "ket"

[tool.typos.files]
extend-exclude = [ "tableaus\\.json" ]


[tool.ty.src]
exclude = [
  "docs/**",
  "python/mqt/scpd/flatbuffers/**",
]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
# Allow type checking without Gurobi installed.
allowed-unresolved-imports = [ "gurobipy" ]


[tool.pytest]
addopts = [
  "-ra",
  "--showlocals",
  "--numprocesses=auto",
]
filterwarnings = [
  "error",
]
log_level = "INFO"
minversion = "9.0"
strict = true
testpaths = [ "test/python" ]
usefixtures = [ "default_solver", "plain_terminal" ]


[tool.coverage]

[tool.coverage.run]
source = [ "mqt.scpd" ]
omit = [
  "*/_compat/*",
  "*/flatbuffers/*",
  "*/visualization/*",
]
parallel = true
disable_warnings = [
  "no-sysmon",
]
core = "sysmon"

[tool.coverage.report]
exclude_also = [
  "@overload",
  '\.\.\.',
  "def __dir__()",             # Supports IDE completion.
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError"
]


[[tool.dynamic-metadata]]
provider = "vcs_versioning"


[tool.vcs-versioning]
write_to = "python/mqt/scpd/_version.py"
